name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create Mock google-services.json
      run: |
        echo '{
          "project_info": { "project_number": "123", "project_id": "dummy-project" },
          "client": [ {
            "client_info": {
              "mobilesdk_app_id": "1:123:android:abc",
              "android_client_info": { "package_name": "com.example.movewise" }
            },
            "oauth_client": [],
            "api_key": [ { "current_key": "dummy_key" } ],
            "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
          } ],
          "configuration_version": "1"
        }' > app/google-services.json

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
